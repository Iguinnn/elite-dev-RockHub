[project]
name = "rockhub-backend"
version = "0.1.0"
description = "API da plataforma de eventos e ingressos RockHub"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
