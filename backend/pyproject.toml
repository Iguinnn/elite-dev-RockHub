[project]
name = "rockhub-backend"
version = "0.1.0"
description = "API da plataforma de eventos e ingressos RockHub"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
    # Runtime, não dev: a Story 2.1 usa o httpx para chamar a Ticketmaster em
    # produção. O build da Railway instala com `--no-dev`, e um pacote só em
    # `dev` some da imagem — o `import` funcionaria na máquina de quem
    # desenvolve e estouraria `ModuleNotFoundError` só no primeiro deploy.
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
