# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic ainda não começou
#   - in-progress: Epic em andamento
#   - done: Todas as stories do epic concluídas
#
# Epic Status Transitions:
#   - backlog → in-progress: automático quando a primeira story é criada (via create-story)
#   - in-progress → done: manual, quando todas as stories chegam a 'done'
#
# Story Status:
#   - backlog: story só existe no epics.md
#   - ready-for-dev: arquivo da story criado na pasta de implementação
#   - in-progress: em implementação
#   - review: pronta para code review
#   - done: concluída
#
# Retrospective Status:
#   - optional: pode ser feita, não é obrigatória
