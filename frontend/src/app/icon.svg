<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="RockHub">
  <!--
    Favicon do RockHub. Substitui o triângulo da Vercel que veio do
    create-next-app e sobreviveu até a Story 1.9.

    A redução carrega os dois marcadores da identidade e mais nada: o breu
    (#0b1618, chão de petróleo, nunca preto puro) e o neon (#ff4f9a, acento
    único do sistema), na voz serifada. Uma letra só, porque 16px não comporta
    o fio duplo do masthead nem a palavra inteira — a essa altura qualquer
    estrutura vira borrão.

    "R" e não "H": é a primeira letra do nome. O neon cita o "Hub" da
    logotipo, que é a metade acentuada da marca.

    ⚠️ Os dois hexes estão **literais aqui**, e é o único lugar do frontend
    onde isso acontece: SVG não lê `var(--token)` do CSS da página. Trocar a
    paleta obriga a voltar neste arquivo à mão — foi o que aconteceu na troca
    de 2026-08-11, e o `grep` por `var(--` não teria encontrado.

    Sem raio e sem sombra, como manda o globals.css. As famílias são de
    sistema (UX-DR2): nenhuma fonte é baixada, aqui também não.
  -->
  <rect width="32" height="32" fill="#0b1618"/>
  <text
    x="16"
    y="24.3"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    fill="#ff4f9a"
  >R</text>
</svg>
